
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#071e3d"/>
  
  <defs>
    <!-- Ocean Blue to Deep Navy -->
    <linearGradient id="grad_ocean_deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#071e3d"/>
    </linearGradient>

    <!-- Ice Blue to Ocean Blue -->
    <linearGradient id="grad_ice_ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Electric Cyan Ice Glow -->
    <linearGradient id="grad_electric_ice" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Dark Luxury Navy Badge Background -->
    <linearGradient id="grad_dark_badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="50%" stop-color="#071e3d"/>
      <stop offset="100%" stop-color="#040f1f"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow_clean" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.14"/>
    </filter>

    <filter id="glow_ice" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>


  <g transform="translate(200, 200) scale(0.38)">
    
    <g id="apex-mark">
      <!-- Outer Left Wing of V -->
      <path d="M-260 -260 L-140 -260 L0 100 L0 300 L-60 180 L-180 -100 L-260 -100 Z" fill="url(#grad_ocean_deep)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      
      <!-- Outer Right Wing of V -->
      <path d="M260 -260 L140 -260 L0 100 L0 300 L60 180 L180 -100 L260 -100 Z" fill="url(#grad_ice_ocean)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

      <!-- Inner Left Wing Accent Fold -->
      <path d="M-180 -100 L-100 -100 L0 100 L-60 180 Z" fill="url(#grad_ocean_deep)" opacity="0.9"/>

      <!-- Inner Right Wing Accent Fold -->
      <path d="M180 -100 L100 -100 L0 100 L60 180 Z" fill="url(#grad_ice_ocean)" opacity="0.9"/>

      <!-- Center Academic Quill & Tech Apex Diamond (Mata Pena Digital) -->
      <!-- Left Facet of Nib -->
      <path d="M-6 -290 L-80 -70 L-6 160 Z" fill="url(#grad_ice_ocean)"/>
      <!-- Right Facet of Nib -->
      <path d="M6 -290 L80 -70 L6 160 Z" fill="url(#grad_electric_ice)"/>
      <!-- Slit & Breathing Hole of Fountain Pen -->
      <line x1="0" y1="-280" x2="0" y2="90" stroke="#071e3d" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-60" r="8" fill="#071e3d"/>
    </g>
  
  </g>

  <g transform="translate(360, 218)" text-anchor="start">
    <text font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="88" letter-spacing="4" fill="#ffffff">
      VONE<tspan fill="#38bdf8">TIS</tspan>
    </text>
    <text y="42" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="18" letter-spacing="6" fill="rgba(255,255,255,0.7)">
      SOLUSI AKADEMIK &amp; KREATIF
    </text>
  </g>
</svg>
