
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#ffffff"/>
  
  <defs>
    <!-- Deep Navy to Ocean Blue -->
    <linearGradient id="g_navy_ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#071e3d"/>
    </linearGradient>

    <!-- Ocean Blue to Luminous Ice Blue -->
    <linearGradient id="g_ice_bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Electric Cyan Glow for AI & Digital -->
    <linearGradient id="g_ai_spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <!-- Center Nib Left -->
    <linearGradient id="g_center_l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Center Nib Right -->
    <linearGradient id="g_center_r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- AI Multi-Color Accents (Subtle Google / Figma homage) -->
    <linearGradient id="g_multi_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#071e3d"/>
    </linearGradient>

    <filter id="shadow_clean" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0284c7" flood-opacity="0.14"/>
    </filter>

    <filter id="spark_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>


  <g transform="translate(420, 450) scale(0.72)" filter="url(#shadow_clean)">
    <!-- Base V6 Emblem -->
    <path d="M-270 -270 L-100 -130 L-20 120 L0 290 L0 300 L-40 160 L-180 -30 L-110 -70 L-270 -270 Z" fill="url(#g_navy_ocean)"/>
    <path d="M-270 -270 L-110 -70 L-180 -30 L-230 -160 Z" fill="#0284c7" opacity="0.9"/>

    <path d="M270 -270 L100 -130 L20 120 L0 290 L0 300 L40 160 L180 -30 L110 -70 L270 -270 Z" fill="url(#g_ice_bright)"/>
    <path d="M270 -270 L110 -70 L180 -30 L230 -160 Z" fill="#38bdf8" opacity="0.9"/>

    <!-- Center Floating Crystal Core -->
    <path d="M-5 -290 L-85 -70 L-5 120 Z" fill="url(#g_center_l)"/>
    <path d="M5 -290 L85 -70 L5 120 Z" fill="url(#g_center_r)"/>
    <path d="M-5 -290 L-5 120 L-40 -70 Z" fill="#071e3d" opacity="0.25"/>
    <path d="M5 -290 L5 120 L40 -70 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Typography with Official 'STORE' Badge -->
  <line x1="680" y1="260" x2="680" y2="640" stroke="#e2e8f0" stroke-width="2"/>
  <g transform="translate(740, 440)" text-anchor="start">
    <g>
      <text font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="94" letter-spacing="6" fill="#071e3d">
        VONE<tspan fill="#0284c7">TIS</tspan>
      </text>
      <!-- PRO / STORE Pill Badge -->
      <g transform="translate(480, -68)">
        <rect width="130" height="42" rx="21" fill="url(#g_ice_bright)"/>
        <text x="65" y="28" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" letter-spacing="3" fill="#ffffff" text-anchor="middle">
          STORE
        </text>
      </g>
    </g>
    <text y="58" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="20" letter-spacing="7" fill="#0284c7">
      PREMIUM DIGITAL SUBSCRIPTION
    </text>
    <text y="98" font-family="'Inter', sans-serif" font-weight="500" font-size="14" letter-spacing="1.5" fill="#64748b">
      GOOGLE PRO • CHATGPT • CANVA • FIGMA • NETFLIX
    </text>
  </g>
</svg>
